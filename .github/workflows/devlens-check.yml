name: DevLens checks
on:
  push:
    branches: [codex/devlens, main]
    paths: ['devlens/**', 'docs/**', '.github/workflows/devlens-check.yml']
  pull_request:
    paths: ['devlens/**', 'docs/**', '.github/workflows/devlens-check.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/*.test.mjs
        working-directory: devlens
      - run: node build.mjs && git diff --exit-code -- ../docs
        working-directory: devlens
